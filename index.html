<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>

    <!--contaner of this forms-->
    <div class="container__form">
      <div class="container__loginimg">

       <span class="text__site">Job Net</span>
       <span class="description">
       "اینجا پر از فریلنسره"
       </span>

           <div id="overlay" class="hidden"></div>
          <!--modal-->
          <div id="modal" class="hidden" role="dialog" arial-modal="true">

                 <input type="text" placeholder="نام:" id="nameInput">
                 <input type="email" placeholder="پست الکترونیکی:" id="emailInput">
                <button id="submitBtn" type="submit"> ثبت نام</button>
                <button id="closeModal"> لغو</button>
                <p id="errorMassage" class="hidden">لطفا اطلاعات را به صورت کامل پر کنید </p>
               </form>
          </div>







    </div>
